<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中山國小聯絡簿與學生簽到系統</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero-clock">
      <section class="clock-block">
        <div class="clock-card">
          <div id="clock" class="digital-clock" aria-live="polite">
            <span id="clockHours" class="time-cell">--</span>
            <span class="clock-separator">:</span>
            <span id="clockMinutes" class="time-cell">--</span>
            <span class="clock-separator">:</span>
            <span id="clockSeconds" class="time-cell seconds">--</span>
          </div>
        </div>
      </section>
      <section class="date-block">
        <div id="dateFull" class="date-full">----</div>
        <div id="weekText" class="week-text">----</div>
        <div id="lunarText" class="lunar-pill">班級聯絡簿</div>
      </section>
      <section class="arrival-card">
        <div class="arrival-title">◷ 遲到時間設定</div>
        <label class="late-time-shell" for="lateTime">
          <input id="lateTime" class="late-time-input" type="time" value="07:50" />
          <span id="lateHour" class="late-time-part">07</span>
          <span class="late-time-colon">:</span>
          <span id="lateMinute" class="late-time-part">50</span>
        </label>
        <div id="timeStatus" class="arrival-status">準時時段 ✅</div>
      </section>
      <section class="top-buttons">
        <button id="calendarBtn" class="icon-btn blue">▣<span>校行事曆</span></button>
        <button id="swapPanelsBtn" class="icon-btn teal">⇄<span>左右對調</span></button>
        <button id="settingsBtn" class="icon-btn purple">⚙<span>系統設定</span></button>
        <button id="fullscreenBtn" class="icon-btn dark">⛶<span>全螢幕</span></button>
      </section>
    </header>
    <div id="topResizeHandle" class="resize-handle top-resize" title="拖曳調整上方時鐘區大小"></div>

    <main class="main-grid">
      <section class="panel contact-panel">
        <div class="panel-head">
          <div>
            <h1><span class="title-icon book">▣</span>今日聯絡簿</h1>
            <div id="selectedDateLabel" class="subtle">----</div>
          </div>
          <div class="head-actions">
            <input id="datePicker" type="date" />
            <button id="editBtn" class="primary-btn">編輯聯絡簿</button>
            <button id="formatBtn" class="ghost-btn">格式</button>
          </div>
        </div>

        <div id="formatPanel" class="font-toolbar hidden">
          <button id="writingModeBtn" class="outline-btn">橫書</button>
          <button id="viewModeBtn" class="ghost-btn">直書</button>
          <button id="fontDownBtn" class="font-btn">A−</button>
          <strong id="fontScaleLabel">100%</strong>
          <button id="fontUpBtn" class="font-btn">A+</button>
          <button id="lineHeightDownBtn" class="font-btn">行−</button>
          <strong id="lineHeightLabel">100%</strong>
          <button id="lineHeightUpBtn" class="font-btn">行+</button>
          <div class="align-toolbar" aria-label="聯絡簿對齊方式">
            <button id="alignLeftBtn" class="align-btn" type="button">置左</button>
            <button id="alignCenterBtn" class="align-btn" type="button">置中</button>
            <button id="alignRightBtn" class="align-btn" type="button">置右</button>
          </div>
          <label class="font-select-label">
            <select id="fontFamilySelect" class="font-select">
              <option value="default">預設黑體</option>
              <option value="rounded">圓體</option>
              <option value="kai">標楷體</option>
              <option value="iansui">芫荽注音字體</option>
            </select>
          </label>
        </div>

        <div id="bookDisplay" class="book-display horizontal-mode">
          <article id="homeworkCard" class="book-card blue-card">
            <div class="circle-icon">▣</div>
            <div>
              <h2>今日功課</h2>
              <div id="homeworkView" class="book-text"></div>
            </div>
          </article>
          <article id="reminderCard" class="book-card green-card">
            <div class="circle-icon">🔔</div>
            <div>
              <h2>明日提醒</h2>
              <div id="reminderView" class="book-text"></div>
            </div>
          </article>
          <article id="testCard" class="book-card orange-card">
            <div class="circle-icon">✎</div>
            <div>
              <h2>考試通知</h2>
              <div id="testView" class="book-text"></div>
            </div>
          </article>
          <article id="noteCard" class="book-card purple-card">
            <div class="circle-icon">📣</div>
            <div>
              <h2>生活叮嚀</h2>
              <div id="noteView" class="book-text"></div>
            </div>
          </article>
          <article id="teacherCard" class="book-card pink-card">
            <div class="circle-icon">♥</div>
            <div>
              <h2>老師的話</h2>
              <div id="teacherView" class="book-text"></div>
            </div>
          </article>
          <div id="emptyBookMessage" class="empty-message">今天尚未填寫聯絡簿</div>
        </div>

        <div id="editor" class="editor hidden">
          <div id="bookFieldToggles" class="book-field-toggles" aria-label="聯絡簿顯示項目">
            <label><input id="homeworkToggle" type="checkbox" data-book-field="homework" />今日功課</label>
            <label><input id="reminderToggle" type="checkbox" data-book-field="reminder" />明日提醒</label>
            <label><input id="testToggle" type="checkbox" data-book-field="test" />考試通知</label>
            <label><input id="noteToggle" type="checkbox" data-book-field="note" />生活叮嚀</label>
            <label><input id="teacherToggle" type="checkbox" data-book-field="teacher" />老師的話</label>
          </div>
          <div class="editor-field" data-book-field-panel="homework"><label for="homeworkInput">今日功課</label><textarea id="homeworkInput" rows="5"></textarea></div>
          <div class="editor-field" data-book-field-panel="reminder"><label for="reminderInput">明日提醒</label><textarea id="reminderInput" rows="1"></textarea></div>
          <div class="editor-field" data-book-field-panel="test"><label for="testInput">考試通知</label><textarea id="testInput" rows="1"></textarea></div>
          <div class="editor-field" data-book-field-panel="note"><label for="noteInput">生活叮嚀</label><textarea id="noteInput" rows="1"></textarea></div>
          <div class="editor-field" data-book-field-panel="teacher"><label for="teacherInput">老師的話</label><textarea id="teacherInput" rows="1"></textarea></div>
          <div class="editor-actions">
            <button id="copyYesterdayBtn" class="outline-btn">貼上昨天的作業</button>
            <button id="saveBookBtn" class="primary-btn">儲存</button>
          </div>
          <div id="autosaveHint" class="subtle">資料會自動儲存在本機瀏覽器。</div>
        </div>
      </section>
      <div id="mainResizeHandle" class="resize-handle main-resize" title="拖曳調整左右區域大小"></div>

      <section class="panel attendance-panel">
        <div class="panel-head attendance-head">
          <div>
            <h1><span class="title-icon people">♣</span>學生簽到區</h1>
          </div>
          <button id="namesBtn" class="outline-btn">👥 名單設定</button>
        </div>

        <div class="summary-row">
          <div class="summary-card ontime"><strong id="arrivedCount">0</strong><span>已到</span></div>
          <div class="summary-card absent"><strong id="absentCount">0</strong><span>未到</span></div>
          <div class="summary-card late"><strong id="lateCount">0</strong><span>遲到</span></div>
          <div class="summary-card leave"><strong id="leaveCount">0</strong><span>請假</span></div>
        </div>

        <div id="studentGrid" class="student-grid"></div>

        <div class="legend">
          <span><i class="dot green"></i>準時（到校時間 ≤ <b id="lateLegendOnTime">07:50</b>）</span>
          <span><i class="dot orange"></i>遲到（到校時間 ＞ <b id="lateLegendLate">07:50</b>）</span>
          <span><i class="dot blue"></i>請假</span>
          <span><i class="dot gray"></i>未到</span>
        </div>

        <div class="bottom-actions">
          <button id="statsBtn" class="white-btn">📊 今日統計</button>
          <button id="recordsBtn" class="white-btn">🗓 查看紀錄</button>
          <button id="resetBtn" class="danger-btn">↻ 重設今日簽到</button>
          <button id="exportBtn" class="success-btn">⇩ 匯出今日紀錄 CSV</button>
        </div>
      </section>
    </main>

  </div>

  <dialog id="studentDialog" class="modal">
    <div class="modal-head">
      <h2 id="studentTitle">學生資料</h2>
      <button class="close-btn" data-close="studentDialog">×</button>
    </div>
    <div id="studentDetail" class="modal-body"></div>
    <div class="modal-actions">
      <button id="markOnTimeBtn" class="primary-btn split-label">改為<br>準時</button>
      <button id="markLateBtn" class="warning-btn split-label">改為<br>遲到</button>
      <button id="markLeaveBtn" class="outline-btn split-label">設為<br>請假</button>
      <button id="markAbsentBtn" class="ghost-btn split-label">改回<br>未到</button>
    </div>
  </dialog>

  <dialog id="namesDialog" class="modal wide-modal">
    <div class="modal-head">
      <h2>學生名單設定</h2>
      <button class="close-btn" data-close="namesDialog">×</button>
    </div>
    <p class="subtle">可直接貼上校務系統學生名冊、教師手冊名單，或每行輸入：座號,姓名。例如：01,王小明</p>
    <textarea id="namesInput" class="names-input"></textarea>
    <div class="modal-actions">
      <button id="resetNamesBtn" class="ghost-btn">恢復 1–30 號</button>
      <button id="saveNamesBtn" class="primary-btn">儲存名單</button>
    </div>
  </dialog>

  <dialog id="infoDialog" class="modal wide-modal">
    <div class="modal-head">
      <h2 id="infoTitle">資訊</h2>
      <button class="close-btn" data-close="infoDialog">×</button>
    </div>
    <div id="infoContent" class="modal-body"></div>
  </dialog>

  <dialog id="settingsDialog" class="modal wide-modal">
    <div class="modal-head">
      <h2>系統設定</h2>
      <button class="close-btn" data-close="settingsDialog">×</button>
    </div>
    <div class="settings-body">
      <label class="class-name-field" for="classNameInput">
        <span>班級名稱</span>
        <input id="classNameInput" type="text" placeholder="班級" maxlength="12" />
      </label>
      <section class="cloud-bar settings-cloud-bar">
        <div class="cloud-actions">
          <button id="signInBtn" class="cloud-btn primary">教師 Google 登入</button>
          <label class="share-attendance-toggle"><input id="shareAttendanceToggle" type="checkbox" /> 分享學生出席</label>
          <button id="publishShareBtn" class="cloud-btn">更新家長分享</button>
          <button id="copyShareBtn" class="cloud-btn">複製家長連結</button>
          <button id="signOutBtn" class="cloud-btn ghost">登出</button>
        </div>
      </section>
    </div>
  </dialog>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
